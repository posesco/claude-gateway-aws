apiVersion: 1
datasources:
  - name: ClaudeGatewayPostgres
    uid: claude-gateway-db
    type: postgres
    access: proxy
    url: ${PG_HOSTPORT}
    user: ${PG_USER}
    database: ${PG_DB}
    isDefault: true
    editable: true
    version: 2
    jsonData:
      database: ${PG_DB}
      sslmode: "require"
      postgresVersion: 1600
      timescaledb: false
    secureJsonData:
      password: "${PG_PASS}"

  - name: ClaudeGatewayLoki
    uid: claude-gateway-loki
    type: loki
    access: proxy
    url: http://localhost:3100
    isDefault: false
    editable: false
    version: 1

  - name: ClaudeGatewayAlertmanager
    uid: claude-gateway-alertmanager
    type: alertmanager
    access: proxy
    url: http://localhost:9093
    isDefault: false
    editable: false
    version: 1
    jsonData:
      implementation: prometheus
      handleGrafanaManagedAlerts: true
